name: peerfall-lab

services:
  lab:
    build: .
    image: peerfall-lab:frr-10.6.1
    hostname: peerfall
    # One container holds every router, each in a network namespace of its own, as the game's VM
    # does. `ip netns add` mounts namespaces under /run/netns and `ip netns exec` remounts /sys
    # (SYS_ADMIN), the links, addresses and qdiscs need NET_ADMIN, and each namespace's
    # net.ipv4.ip_forward is written under /proc/sys, which only a privileged container may write.
    privileged: true
    # FRR's daemons detach (-d) and are adopted by PID 1, which must reap them.
    init: true
    tmpfs:
      - /run
      - /tmp
    stop_grace_period: 1s
