  <body>
    <div id="root"></div>
    <!-- The game is drawn by its script. Without it, this says what the game is and where its source is. -->
    <noscript>
      <main style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font: 1rem/1.6 system-ui, sans-serif">
        <h1>Peerfall</h1>
        <p>Peerfall is a free, open-source browser game that teaches FRRouting (FRR), from your first router to operating a multi-protocol network. You build networks, diagnose outages and verify recovery.</p>
        <p>The network is real: a Linux kernel running in an emulated PC inside your browser, with one network namespace per router and FRR’s own daemons in each. You type into the real vtysh. There is nothing to install and no server, and your progress stays in your browser.</p>
        <p>
          Peerfall needs JavaScript and a desktop browser. The source is on
          <a href="https://github.com/amrshadid/peerfall">GitHub</a>, under the MIT license. Made by
          <a href="https://shadid.dev">Amr Shadid</a>.
        </p>
      </main>
    </noscript>
