name: Bug report
description: Something in the game or the code doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open mission …
        2. Run …
        3. See …
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Mission or screen, browser and version.
      placeholder: "The Link That Never Went Down, Firefox 140"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console output, terminal output, screenshots.
      render: text
