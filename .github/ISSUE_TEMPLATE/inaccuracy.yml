name: Inaccuracy
description: The game teaches or shows something that doesn't match real FRR or Linux.
labels: [accuracy]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Accuracy reports are some of the most valuable contributions.
  - type: input
    id: where
    attributes:
      label: Where in the game
      placeholder: "The Link That Never Went Down, the debrief, or the timeline"
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: What the game does or says
    validations:
      required: true
  - type: textarea
    id: real
    attributes:
      label: What real FRR or Linux does
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: FRR source path and function, the FRR documentation, an RFC, or output from a real router (with the FRR version).
      placeholder: "ospfd/ospf_bfd.c: ospf_bfd_session_change(), or RFC 5880 section 6.8.4"
    validations:
      required: true
