name: PR title

# Pull requests are squash-merged, so the title becomes the commit message on
# main and must follow Conventional Commits (see CONTRIBUTING.md).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            build
            ci
            perf
          scopes: |
            core
            machine
            theme
            game
            missions
            web
            lab
            docs
            repo
            ci
            deps
