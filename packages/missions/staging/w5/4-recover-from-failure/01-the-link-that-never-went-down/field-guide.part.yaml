# Field Guide entries this mission introduces.
entries:
  - name: show ip ospf neighbor
    kind: vtysh
    what: OSPF's peers on this router, one line each, with their state and the dead timer counting down.
    firstMet: the-link-that-never-went-down
  - name: show ip ospf interface
    kind: vtysh
    what: OSPF on each interface, with its cost and its hello and dead timers.
    firstMet: the-link-that-never-went-down
  - name: ip ospf bfd
    kind: vtysh
    what: In interface mode, asks bfdd for a BFD session with every OSPF peer on that interface. Needed at both ends.
    firstMet: the-link-that-never-went-down
  - name: show bfd peers
    kind: vtysh
    what: bfdd's sessions, with their state, the peer's ID and the timers.
    firstMet: the-link-that-never-went-down
