# Staging copy of content/chapters.yaml, only the stage these missions belong to.
chapters:
  - id: first-router
    title: First router
    summary: Start FRR on Linux, find its daemons, use vtysh, and save and reload a configuration.
    story: One router, alone and silent. Before it can find any peer, FRR has to run on it, answer its console, and keep what you tell it across a restart.
    guide: zebra
    standsFor: FRR's daemons, watchfrr, vtysh and frr.conf
    outcomes:
      - start FRR the way an installed router does, and tell which daemons run
      - read and change a router's configuration in vtysh
      - save a change so that it survives a restart
