entries:
  - {
      name: ip -br link,
      kind: shell,
      what: "list the router's interfaces, one per line, with whether each is up",
      firstMet: the-dark-cable,
    }
  - {
      name: ip -br addr,
      kind: shell,
      what: "list the router's interfaces with their addresses",
      firstMet: the-dark-cable,
    }
  - {
      name: ip route,
      kind: shell,
      what: "show the router's routing table: one route per line",
      firstMet: the-dark-cable,
    }
  - {
      name: ping -c 3,
      kind: shell,
      what: "send three packets to an address and print each answer and how long it took",
      firstMet: the-dark-cable,
    }
  - {
      name: ip link set up,
      kind: shell,
      what: "switch an interface on from Linux: ip link set a-c up",
      firstMet: the-dark-cable,
    }
