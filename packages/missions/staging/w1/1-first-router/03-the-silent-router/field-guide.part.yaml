entries:
  - {
      name: /usr/lib/frr/frrinit.sh status a,
      kind: shell,
      what: "ask FRR's init script which of a's daemons run",
      firstMet: the-silent-router,
    }
  - {
      name: /usr/lib/frr/frrinit.sh start a,
      kind: shell,
      what: "start FRR on router a: watchfrr, which starts the daemons in the daemons file",
      firstMet: the-silent-router,
    }
  - {
      name: vtysh -c,
      kind: shell,
      what: 'run one vtysh command and come back to the shell: vtysh -c "show daemons"',
      firstMet: the-silent-router,
    }
  - {
      name: show watchfrr,
      kind: vtysh,
      what: "ask watchfrr which daemons it watches, their state and its restart command",
      firstMet: the-silent-router,
    }
  - { name: pkill, kind: shell, what: "stop every process with that name: pkill staticd", firstMet: the-silent-router }
