# Field Guide entries this mission introduces.
entries:
  - name: ip route get
    kind: shell
    what: Looks one address up in the kernel's routing table and prints the route Linux would send a packet by, or why it can't.
    firstMet: one-hop-further
  - name: ip route
    kind: vtysh
    what: In configure mode, writes a static route, a network and its next hop, such as ip route 10.0.2.0/30 10.0.1.2.
    firstMet: one-hop-further
  - name: show ip route <address>
    kind: vtysh
    what: The route zebra uses for one address or network, in detail, with its source, distance and next hop.
    firstMet: one-hop-further
  - name: traceroute -n
    kind: shell
    what: Lists the routers a packet passes on its way to an address, by number, one line per hop.
    firstMet: one-hop-further
