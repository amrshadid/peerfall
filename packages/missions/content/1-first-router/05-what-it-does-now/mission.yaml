id: what-it-does-now
version: 1
title: What It Does Now
summary: Read the running configuration, label an interface in its own mode, and see the change appear there and nowhere else.
minutes: 15
chapter: first-router
objective: Router a's interface to c has a description in the running configuration.
prerequisites: [the-routers-language]
teaches: [running-config, interface-description]
names: [saved-config]
uses: [vtysh, cli-modes, cli-help, interface]

# Stage 1's three routers. FRR runs on a, started by its own init script, with only the lines
# the Machine writes in frr.conf: both cables are up and nothing is labelled.
network:
  routers:
    - name: a
      loopback: 10.255.0.1/32
      daemons: []
      startup: watchfrr
      config: ""
    - name: b
      daemons: []
      config: ""
    - name: c
      daemons: []
      config: ""
  links:
    - ends: [{ router: a, address: 10.0.1.1/30 }, { router: b, address: 10.0.1.2/30 }]
    - ends: [{ router: a, address: 10.0.2.1/30 }, { router: c, address: 10.0.2.2/30 }]

objectives:
  - id: labelled
    text: Give a's interface to c a description.
    check: { kind: config, router: a, source: running, block: [interface a-c], line: description }

hints:
  - text: "`show running-config` prints everything FRR is doing now. Read it before and after you change something."
  - text: A description is a setting of one interface, so it is typed in that interface's mode, after `configure terminal`.
  - text: In `a(config-if)#` for `a-c`, give it any words you like after this word.
    command: description link to router c

chips:
  - { command: show running-config, explain: "in vtysh: everything FRR is doing now, as configuration" }
  - { command: show interface description, explain: "in vtysh: every interface with its description" }
  - { command: description, explain: "in interface mode: label the interface" }
  - { command: cat, explain: "at the shell: show a file, such as /etc/frr/a/frr.conf" }

codex:
  - id: running-config
    term: The running configuration
    simple: "Every setting FRR's daemons hold now, as text. `show running-config` prints it; each change you type is in it at once."
    deep: "vtysh asks each daemon for its part and prints them as one configuration, in the same words you type. Only settings that differ from their defaults appear: after `no shutdown`, `interface a-c` left it altogether. It lives in the daemons' memory, so a restart loses whatever was never saved. `write terminal` prints the same text."
    sources: [vtysh/vtysh.c, vtysh/vtysh_config.c]
    docs: https://docs.frrouting.org/en/latest/basic.html
    tryIt: vtysh -c "show running-config"
  - id: interface-description
    term: An interface's description
    simple: A label for an interface, for the people who read the configuration. FRR does nothing else with it.
    deep: "Typed in interface mode as `description` and any words. It shows in `show interface a-c` as `Description: link to router c` and in `show interface description`. A new description replaces the old one, and `no description` removes it. Linux knows nothing of it: `ip link show a-c` shows no label."
    sources: [lib/if.c, zebra/interface.c]
    docs: https://docs.frrouting.org/en/latest/zebra.html
    tryIt: vtysh -c "show interface description"

story:
  scene: story.md#scene
  seeIt: story.md#see-it
