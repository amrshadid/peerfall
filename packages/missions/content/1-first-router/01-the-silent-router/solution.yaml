# The golden runs: what a player might do, and whether the mission must pass.
# `shell` lines are typed at that router's shell, `lines` into its vtysh.
runs:
  - id: start
    passes: false
    changes: []
  # One daemon started by hand: vtysh has something to talk to, but FRR is not whole.
  - id: zebra-by-hand
    passes: false
    changes:
      - router: a
        shell: [/usr/lib/frr/zebra -d -N a]
  # Every daemon started by hand: they answer, and nothing watches them.
  - id: daemons-by-hand
    passes: false
    changes:
      - router: a
        shell:
          - /usr/lib/frr/zebra -d -N a
          - /usr/lib/frr/mgmtd -d -N a
          - /usr/lib/frr/staticd -d -N a
  - id: init-script
    passes: true
    changes:
      - router: a
        shell: [/usr/lib/frr/frrinit.sh start a]
