id: gone-after-the-restart
version: 2
title: Gone After the Restart
summary: Change one thing on a router, and make the change survive a restart.
minutes: 15
chapter: first-router
objective: Router a's loopback interface has a description that is still there after FRR restarts.
prerequisites: [the-silent-router]
teaches: [running-config, saved-config]
uses: [frr-daemon, vtysh, watchfrr]

# One router, with FRR started by its own init script as on an installed router. Its frr.conf
# holds only the lines the Machine writes: nobody has saved anything yet.
network:
  routers:
    - name: a
      loopback: 10.255.0.1/32
      daemons: []
      startup: watchfrr
      config: ""
  links: []

objectives:
  - id: saved
    text: Give a's interface lo a description and save it, so that it is in a's frr.conf.
    check: { kind: config, router: a, source: saved, block: [interface lo], line: description }
  - id: survives
    text: After FRR restarts, a is still running with the description.
    # What FRR's init script last started a from: the description survived a restart only if
    # it was in frr.conf when the player restarted FRR.
    check: { kind: config, router: a, source: started, block: [interface lo], line: description }

hints:
  - text: A router has two configurations. The running one is what FRR does now, and you read it in vtysh with show running-config. The saved one is the file /etc/frr/a/frr.conf, which FRR reads when it starts. Compare the two after you change something.
  - text: A restart stops every daemon, and FRR starts again knowing only what frr.conf says. The running configuration is copied into that file only when you ask.
  - text: Give lo its description in configure terminal, then, back outside configure terminal, copy the running configuration into frr.conf.
    command: write memory

chips: []
codex: []

story:
