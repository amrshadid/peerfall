id: gone-after-the-restart
version: 1
title: Gone After the Restart
chapter: first-router
objective: Router a's loopback interface has a description that is still there after FRR restarts.
prerequisites: [the-silent-router]

# One router, with FRR started by its own init script as on an installed router. Its frr.conf
# holds only the lines the Machine writes: nobody has saved anything yet.
network:
  routers:
    - name: a
      loopback: 10.255.0.1/32
      daemons: []
      startup: watchfrr
      config: ""
  links: []

# What is judged is what a restart leaves: FRR starts again from frr.conf, and only from it.
restartOnCheck: [a]

objectives:
  - id: saved
    text: Give a's interface lo a description and save it, so that it is in a's frr.conf.
    check: { kind: config, router: a, source: saved, block: [interface lo], line: description }
    hints:
      - text: A router has two configurations. The running one is what FRR does now, and you read it in vtysh with show running-config. The saved one is the file /etc/frr/a/frr.conf, which FRR reads when it starts. Compare the two after you change something.
      - text: To change the running configuration, open vtysh, enter configure terminal, then interface lo, then a description with any words you like, then end.
        command: description loopback of router a
      - text: The running configuration is copied into frr.conf only when you ask. In vtysh, outside configure terminal, enter this.
        command: write memory
  - id: survives
    text: After FRR restarts, a is still running with the description.
    check: { kind: config, router: a, source: running, block: [interface lo], line: description }
    hints:
      - text: Checking your work restarts FRR on a first, as a power cut would. FRR then knows only what frr.conf says. If the description is gone afterwards, it was never in that file.
      - text: You can see it yourself before you check. Restart FRR from a's shell, then read the running configuration again.
        command: /usr/lib/frr/frrinit.sh restart a
