# The skill tree: what the player can do after each mission, in play order. A mission lists
# the skills it earns (`skills:`) and the skills it needs (`prerequisites:`), and it opens once
# the missions completed so far have earned every one. A skill's `region` is the region of
# chapters.yaml whose mission earns it; its `prerequisites` are the skills it builds on.
skills:
  # Stage 1, Meet the router
  - id: linux-interfaces-and-routes
    title: Read a router's interfaces and routes
    region: meet-the-router
    # Earned in 1.1, The Dark Cable.
    prerequisites: []
  - id: frr-start-zebra
    title: Start zebra and talk to it in vtysh
    region: meet-the-router
    # Earned in 1.2, Nobody Answers.
    prerequisites: [linux-interfaces-and-routes]
  - id: frr-init-script
    title: Start FRR with its own script, kept running by watchfrr
    region: meet-the-router
    # Earned in 1.3, The Silent Router.
    prerequisites: [frr-start-zebra]
  # Stage 1, Configure it and keep it
  - id: cli-help-and-modes
    title: Ask vtysh for help and type in the right mode
    region: configure-and-keep-it
    # Earned in 1.4, The Router's Language.
    prerequisites: [frr-init-script]
  - id: cli-running-config
    title: Read and change what the router runs now
    region: configure-and-keep-it
    # Earned in 1.5, What It Does Now.
    prerequisites: [cli-help-and-modes]
  - id: config-write-memory
    title: Save a change so that it survives a restart
    region: configure-and-keep-it
    # Earned in 1.6, Gone After the Restart.
    prerequisites: [cli-running-config]
  - id: config-find-refused-line
    title: Find and fix a line FRR refused
    region: configure-and-keep-it
    # Earned in 1.7, The Skipped Line.
    prerequisites: [config-write-memory]
  - id: frr-router-from-nothing
    title: Bring a router up from nothing
    region: configure-and-keep-it
    # Earned in 1.8, A Router from Nothing.
    prerequisites: [config-find-refused-line]
  # Stage 2, Routes by hand
  - id: ip-addresses
    title: Give interfaces addresses and read the routes they bring
    region: routes-by-hand
    # Earned in 2.1, Two Ends of One Cable.
    prerequisites: [frr-router-from-nothing]
  - id: static-routes
    title: Write a static route through a next hop
    region: routes-by-hand
    # Earned in 2.2, One Hop Further.
    prerequisites: [ip-addresses]
  - id: return-path
    title: Find a missing way back and route the reply home
    region: routes-by-hand
    # Earned in 2.3, The Reply That Never Came Back.
    prerequisites: [static-routes]
  # Stage 2, zebra's choice
  - id: rib-and-fib
    title: Follow a route from zebra's table into the kernel's
    region: zebras-choice
    # Earned in 2.4, Written but Not Used.
    prerequisites: [return-path]
  - id: administrative-distance
    title: Choose between routes with administrative distance
    region: zebras-choice
    # Earned in 2.5, The Backup Path.
    prerequisites: [rib-and-fib]
  - id: static-line-of-routers
    title: Route a line of three routers from bare cables
    region: zebras-choice
    # Earned in 2.6, Bring the Line Up.
    prerequisites: [administrative-distance]
  # Stage 4, Notice it fast
  - id: outage-measure
    title: Measure an outage and tell what noticed it
    region: notice-it-fast
    # Earned in 4.1, The Link That Never Went Down.
    prerequisites: [static-line-of-routers]
  - id: bfd-fast-detection
    title: Make OSPF notice a dead link in under a second with BFD
    region: notice-it-fast
    # Earned in 4.1, The Link That Never Went Down.
    prerequisites: [outage-measure]
