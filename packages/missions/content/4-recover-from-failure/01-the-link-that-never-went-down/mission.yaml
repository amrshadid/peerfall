id: the-link-that-never-went-down
version: 1
title: The Link That Never Went Down
summary: Measure an outage on a link that stays up, and make OSPF notice it in about a second with BFD.
minutes: 25
chapter: recover-from-failure
objective: When the link between a and c stops passing packets, traffic from a to c is back through b in under two seconds.
# Kept as it was: the network, the probe, the fault, the recovery target, the objectives and
# their checks, so the four recorded golden runs stay valid. Only the story, hints, chips and
# cards are new. Stage 3 is not written yet, so the story explains OSPF's terms where they appear.
# It follows stage 3's last mission; until stage 3 is written, it follows stage 2's capstone.
prerequisites: [bring-the-line-up]
teaches: [bfd, ospf-dead-interval]
names: [ospf-adjacency]
uses: [route, next-hop, administrative-distance, vtysh, cli-modes]

# Three routers in a triangle. Every link costs 10, so a reaches c directly (cost 10)
# and keeps the way through b (cost 20) as its backup.
network:
  routers:
    - name: a
      loopback: 10.255.0.1/32
      daemons: [ospfd, bfdd]
      config: |
        interface a-b
         ip ospf area 0
         ip ospf network point-to-point
         ip ospf cost 10
        !
        interface a-c
         ip ospf area 0
         ip ospf network point-to-point
         ip ospf cost 10
        !
        interface lo
         ip ospf area 0
         ip ospf passive
        !
        router ospf
         ospf router-id 10.255.0.1
         log-adjacency-changes detail
    - name: b
      loopback: 10.255.0.2/32
      daemons: [ospfd, bfdd]
      config: |
        interface b-a
         ip ospf area 0
         ip ospf network point-to-point
         ip ospf cost 10
        !
        interface b-c
         ip ospf area 0
         ip ospf network point-to-point
         ip ospf cost 10
        !
        interface lo
         ip ospf area 0
         ip ospf passive
        !
        router ospf
         ospf router-id 10.255.0.2
         log-adjacency-changes detail
    - name: c
      loopback: 10.255.0.3/32
      daemons: [ospfd, bfdd]
      config: |
        interface c-a
         ip ospf area 0
         ip ospf network point-to-point
         ip ospf cost 10
        !
        interface c-b
         ip ospf area 0
         ip ospf network point-to-point
         ip ospf cost 10
        !
        interface lo
         ip ospf area 0
         ip ospf passive
        !
        router ospf
         ospf router-id 10.255.0.3
         log-adjacency-changes detail
  links:
    - ends:
        - { router: a, address: 10.0.1.1/30 }
        - { router: b, address: 10.0.1.2/30 }
    - ends:
        - { router: a, address: 10.0.2.1/30 }
        - { router: c, address: 10.0.2.2/30 }
    - ends:
        - { router: b, address: 10.0.3.1/30 }
        - { router: c, address: 10.0.3.2/30 }

# The link drops every packet, both ways. Its interfaces stay up.
fault:
  link: [a, c]

probe:
  id: a-to-c
  from: a
  source: 10.255.0.1
  destination: 10.255.0.3
  intervalMs: 50

# FRR's default BFD timers (300 ms, three missed packets) detect within 900 ms. On the Machine
# recovery measured 0.67 to 1.16 s, so a one-second target would fail runs that did everything right.
recoveryTargetMs: 2000

objectives:
  - id: reaches-c
    text: Send a probe from a to c and see the replies come back.
    check: { kind: reachable, minReplies: 3 }
  - id: direct-while-healthy
    text: Find the way a's traffic takes to c while the network is healthy.
    check: { kind: path, before: a-c }
  - id: recovers-through-b
    text: Break the link and get traffic back through b in under two seconds.
    check: { kind: recovery, via: a-b }

hints:
  - text: Press Send probe, then Break the link with nothing changed, and read the timeline. What finally moved a's traffic to b, and how long after the fault?
  - text: OSPF drops a silent peer only when its dead timer runs out, 40 seconds after the last hello. BFD checks the cable every 300 ms and tells OSPF at once. A BFD session needs both routers on the cable.
  - text: On a, in interface mode for a-c, type this line. Then the same on c, in interface mode for c-a.
    command: ip ospf bfd

chips:
  - { command: show ip ospf neighbor, explain: "OSPF's peers on this router, their state and their dead timer" }
  - { command: show ip ospf interface, explain: "OSPF on each interface, with its hello and dead timers" }
  - { command: show ip route, explain: "zebra's table; OSPF's routes are marked O" }
  - { command: ip ospf bfd, explain: "in interface mode: ask bfdd to watch every OSPF peer on this interface" }
  - { command: show bfd peers, explain: "bfdd's sessions, their state and timers" }
  - { command: do show bfd peers, explain: "the same from interface mode, where a show needs do" }

codex:
  - id: ospf-dead-interval
    term: OSPF hellos and the dead timer
    simple: OSPF peers send each other a hello every 10 seconds. A peer silent for 40 seconds, the dead interval, is dropped.
    deep: "Both are set per interface: show ip ospf interface a-c prints Hello 10s, Dead 40s. The countdown starts again at every hello, so how long a silent cable goes unnoticed depends on when the last hello arrived: 31 to 38 seconds in five runs on the Machine. With debug ospf nsm on, the log then says Timer (Inactivity timer expire), and the peer goes from Full to Deleted. Only then does OSPF work out new routes."
    sources: [ospfd/ospf_nsm.c, ospfd/ospf_interface.c]
    docs: https://docs.frrouting.org/en/latest/ospfd.html
    tryIt: vtysh -c "show ip ospf interface"
  - id: bfd
    term: BFD, Bidirectional Forwarding Detection
    simple: A small protocol whose only job is to notice fast that a neighbour stopped answering. bfdd runs it and tells OSPF.
    deep: "The two ends of a session each send a BFD packet every 300 ms by default. When three intervals pass with nothing heard, the 900 ms Detection timeout, the session goes down and bfdd tells the daemons that asked for it. ip ospf bfd makes ospfd ask for a session with each OSPF peer on that interface. Alone, a session stays down with Remote ID: 0."
    sources: [bfdd/bfd.c, bfdd/bfd_packet.c, ospfd/ospf_bfd.c]
    docs: https://docs.frrouting.org/en/latest/bfd.html
    tryIt: vtysh -c "show bfd peers"

story:
  scene: story.md#scene
  seeIt: story.md#see-it
  buildIt: story.md#build-it
  watchIt: story.md#watch-it
  debrief: story.md#debrief
  realWorld: story.md#real-world
