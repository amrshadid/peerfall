# The golden runs: what a player might do, and whether the mission must pass.
# `lines` are typed into that router's vtysh, one after another.
runs:
  - id: start
    passes: false
    changes: []
  # The way there only: packets reach c, and c has no route for its replies.
  - id: route-on-a-only
    passes: false
    changes:
      - router: a
        lines: [configure terminal, ip route 10.0.2.0/30 10.0.1.2]
  # The way back only: a still has nowhere to send the packets.
  - id: route-on-c-only
    passes: false
    changes:
      - router: c
        lines: [configure terminal, ip route 10.0.1.0/30 10.0.2.1]
  - id: both-ways
    passes: true
    changes:
      - router: a
        lines: [configure terminal, ip route 10.0.2.0/30 10.0.1.2]
      - router: c
        lines: [configure terminal, ip route 10.0.1.0/30 10.0.2.1]
  # Default routes do the same job: the kernel uses the longest prefix that covers the address.
  - id: default-routes
    passes: true
    changes:
      - router: a
        lines: [configure terminal, ip route 0.0.0.0/0 10.0.1.2]
      - router: c
        lines: [configure terminal, ip route 0.0.0.0/0 10.0.2.1]
