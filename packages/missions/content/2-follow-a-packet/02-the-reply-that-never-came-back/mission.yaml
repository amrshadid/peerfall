id: the-reply-that-never-came-back
version: 1
title: The Reply That Never Came Back
chapter: follow-a-packet
objective: Router a reaches router c through b, with a static route on a for the way there and one on c for the way back.
prerequisites: [two-ends-of-one-cable]

# Three routers in a line. Every interface has its address, so each router knows the networks
# it is plugged into and nothing else: a and c have no route to each other's network.
network:
  routers:
    - name: a
      daemons: [staticd]
      config: ""
    - name: b
      daemons: [staticd]
      config: ""
    - name: c
      daemons: [staticd]
      config: ""
  links:
    - ends:
        - { router: a, address: 10.0.1.1/30 }
        - { router: b, address: 10.0.1.2/30 }
    - ends:
        - { router: b, address: 10.0.2.1/30 }
        - { router: c, address: 10.0.2.2/30 }

# For the player to send and watch. The mission is judged from the kernels' routes and a ping.
probe:
  id: a-to-c
  from: a
  source: 10.0.1.1
  destination: 10.0.2.2
  intervalMs: 200

objectives:
  - id: a-route-to-c
    text: Give a a static route for c's network, 10.0.2.0/30, through b.
    check: { kind: route, router: a, to: 10.0.2.2, protocol: static }
    hints:
      - text: Select router a and try to reach c's address, 10.0.2.2. Then read a's routing table, in vtysh with show ip route or in Linux with ip route, and look for a line that covers that address.
      - text: A static route is a line you write yourself. It names a network and the next hop, the neighbor that packets for it are handed to. a's only neighbor is b, at 10.0.1.2.
      - text: In a's vtysh enter configure terminal, then this line, then end.
        command: ip route 10.0.2.0/30 10.0.1.2
  - id: c-route-back
    text: Give c a static route for a's network, 10.0.1.0/30, through b.
    check: { kind: route, router: c, to: 10.0.1.1, protocol: static }
    hints:
      - text: With a's route in place, send packets from a to 10.0.2.2 again. They leave now, and still nothing comes back. Think about what c must do with its reply, and read c's routing table.
      - text: A reply is a packet too, addressed to a at 10.0.1.1, and c has no route that covers that address. c's only neighbor is b, at 10.0.2.1.
      - text: In c's vtysh enter configure terminal, then this line, then end.
        command: ip route 10.0.1.0/30 10.0.2.1
  - id: a-reaches-c
    text: Send packets from a to c and see the replies come back.
    check: { kind: reaches, from: a, to: 10.0.2.2 }
    hints:
      - text: A packet needs a route at every router on the way there, and its reply needs one at every router on the way back. b is plugged into both networks, so it already has both.
      - text: In a's terminal, outside vtysh, send three packets to c's address.
        command: ping -c 3 10.0.2.2
