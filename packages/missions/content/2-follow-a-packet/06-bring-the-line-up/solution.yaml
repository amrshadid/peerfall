# The golden runs: what a player might do, and whether the mission must pass.
# `lines` are typed into that router's vtysh, `shell` at its shell; `restart: true` is the player's
# own /usr/lib/frr/frrinit.sh restart <router>.
runs:
  - id: start
    passes: false
    changes: []
  # Everything right in the running configurations, never saved, then every router restarted.
  - id: not-saved
    passes: false
    changes:
      - router: a
        lines: [configure terminal, interface a-b, ip address 10.0.1.1/30, exit, ip route 10.0.2.0/30 10.0.1.2]
      - router: b
        lines: [configure terminal, interface b-a, ip address 10.0.1.2/30, exit, interface b-c, ip address 10.0.2.1/30]
      - router: c
        lines: [configure terminal, interface c-b, ip address 10.0.2.2/30, exit, ip route 10.0.1.0/30 10.0.2.1]
      - { router: a, restart: true }
      - { router: b, restart: true }
      - { router: c, restart: true }
  # Addresses from Linux, routes in FRR and saved: a reaches c, and FRR's files lack the addresses.
  - id: addresses-from-linux
    passes: false
    changes:
      - router: a
        shell: [ip addr add 10.0.1.1/30 dev a-b]
      - router: b
        shell: [ip addr add 10.0.1.2/30 dev b-a, ip addr add 10.0.2.1/30 dev b-c]
      - router: c
        shell: [ip addr add 10.0.2.2/30 dev c-b]
      - router: a
        lines: [configure terminal, ip route 10.0.2.0/30 10.0.1.2, end, write memory]
      - router: c
        lines: [configure terminal, ip route 10.0.1.0/30 10.0.2.1, end, write memory]
      - { router: a, restart: true }
      - { router: b, restart: true }
      - { router: c, restart: true }
  # The way there only, saved and restarted: c has no route back, so a's pings go unanswered.
  - id: no-way-back
    passes: false
    changes:
      - router: a
        lines:
          [
            configure terminal,
            interface a-b,
            ip address 10.0.1.1/30,
            exit,
            ip route 10.0.2.0/30 10.0.1.2,
            end,
            write memory,
          ]
      - router: b
        lines:
          [
            configure terminal,
            interface b-a,
            ip address 10.0.1.2/30,
            exit,
            interface b-c,
            ip address 10.0.2.1/30,
            end,
            write memory,
          ]
      - router: c
        lines: [configure terminal, interface c-b, ip address 10.0.2.2/30, end, write memory]
      - { router: a, restart: true }
      - { router: b, restart: true }
      - { router: c, restart: true }
  - id: line-up
    passes: true
    changes:
      - router: a
        lines:
          [
            configure terminal,
            interface a-b,
            ip address 10.0.1.1/30,
            exit,
            ip route 10.0.2.0/30 10.0.1.2,
            end,
            write memory,
          ]
      - router: b
        lines:
          [
            configure terminal,
            interface b-a,
            ip address 10.0.1.2/30,
            exit,
            interface b-c,
            ip address 10.0.2.1/30,
            end,
            write memory,
          ]
      - router: c
        lines:
          [
            configure terminal,
            interface c-b,
            ip address 10.0.2.2/30,
            exit,
            ip route 10.0.1.0/30 10.0.2.1,
            end,
            write memory,
          ]
      - { router: a, restart: true }
      - { router: b, restart: true }
      - { router: c, restart: true }
