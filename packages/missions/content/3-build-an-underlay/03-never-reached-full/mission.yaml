id: never-reached-full
version: 1
title: Never Reached Full
summary: Find why two OSPF peers stop before Full, and match the largest packet each end of their link sends.
minutes: 20
chapter: build-an-underlay
objective: a and b are OSPF peers in the state Full, and a large packet from a crosses their link and comes back.
skills: [ospf-mtu]
prerequisites: [ospf-lsdb]
teaches: [mtu, ospf-adjacency]
names: []
uses: [peer, lsdb, interface, frr-log]

# Two routers, both fully configured for OSPF. b's end of the link has an MTU of 9000, set in
# Linux, and a's has Linux's 1500: hellos cross, the database exchange does not, and neither do
# large packets. FRR has no MTU command on Linux, so the fix is in Linux.
network:
  routers:
    - name: a
      loopback: 10.255.0.1/32
      daemons: [ospfd]
      config: |
        interface a-b
         ip ospf area 0
         ip ospf network point-to-point
        !
        interface lo
         ip ospf area 0
         ip ospf passive
        !
        router ospf
         ospf router-id 10.255.0.1
         log-adjacency-changes detail
    - name: b
      loopback: 10.255.0.2/32
      daemons: [ospfd]
      config: |
        interface b-a
         ip ospf area 0
         ip ospf network point-to-point
        !
        interface lo
         ip ospf area 0
         ip ospf passive
        !
        router ospf
         ospf router-id 10.255.0.2
         log-adjacency-changes detail
  links:
    - ends:
        - { router: a, address: 10.0.1.1/30 }
        - { router: b, address: 10.0.1.2/30, mtu: 9000 }

objectives:
  - id: full
    text: Make b a's OSPF peer on a-b, in the state Full.
    check: { kind: peer, router: a, protocol: ospf, peer: 10.255.0.2, interface: a-b }
  - id: large-packet
    text: A packet with 2000 bytes of data from a reaches b's address, 10.0.1.2, and its reply comes back.
    check: { kind: reaches, from: a, to: 10.0.1.2, size: 2000 }

hints:
  - text: Compare ip link show a-b on a with ip link show b-a on b. Read the number after mtu.
  - text: The MTU is the largest packet an interface sends. Both ends of a link must agree on it, or OSPF's database packets and other large packets are lost.
  - text: The MTU belongs to Linux, not FRR. At b's shell, set b-a back to Linux's usual size.
    command: ip link set b-a mtu 1500

chips:
  - { command: show ip ospf neighbor, explain: "OSPF's peers on this router and their state" }
  - { command: show ip ospf interface, explain: "OSPF on each interface, with the MTU it sends" }
  - { command: tail -n 3 /var/log/frr/a.log, explain: "at a's shell: the last lines of a's FRR log" }
  - { command: ip link show, explain: "at the shell: each interface with its MTU" }
  - { command: ping -c 2 -s 2000 10.0.1.2, explain: "at a's shell: send b two packets with 2000 bytes of data" }
  - { command: ip link set b-a mtu 1500, explain: "at b's shell: set the MTU of b's end to Linux's usual 1500" }

codex:
  - id: mtu
    term: MTU, maximum transmission unit
    simple: The largest packet an interface sends, in bytes. Linux's usual is 1500. Both ends of a link must agree on it.
    deep: "Linux keeps it per interface: ip link show prints mtu 1500, and ip link set b-a mtu 1500 changes it. FRR reads it from Linux and has no command on Linux to set it. A packet larger than the far end's MTU is dropped there, while small ones cross, so ping looks fine. OSPF writes its MTU into its database packets and refuses a peer's larger one."
    sources: [zebra/if_netlink.c, ospfd/ospf_packet.c]
    docs: https://docs.frrouting.org/en/latest/ospfd.html
    tryIt: ip link show
  - id: ospf-adjacency
    term: An adjacency, and the states before Full
    deepens: peer
    simple: Two OSPF peers that have swapped their databases. On the way they pass ExStart, Exchange and Loading, then Full.
    deep: "In ExStart the two agree who leads; in Exchange they send database descriptions, lists of the LSAs each holds; in Loading each asks for the ones it lacks. Only Full peers' links go into the routers' router-LSAs. A database description carries the sender's MTU, and a peer whose MTU is larger is refused: both stay in ExStart. ip ospf mtu-ignore skips that test and fixes nothing else."
    sources: [ospfd/ospf_nsm.c, ospfd/ospf_packet.c]
    docs: https://docs.frrouting.org/en/latest/ospfd.html
    tryIt: vtysh -c "show ip ospf neighbor"

